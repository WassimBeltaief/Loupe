[versions]
kotlin                = "2.1.0"
kct                   = "0.7.0"
coroutines            = "1.9.0"
android-gradle-plugin = "8.7.0"
compose-bom           = "2025.06.00"
lifecycle             = "2.8.7"

[libraries]
kotlin-compiler       = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable",      version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api",     version.ref = "kotlin" }
android-tools-gradle  = { module = "com.android.tools.build:gradle",                       version.ref = "android-gradle-plugin" }
kotlin-test           = { module = "org.jetbrains.kotlin:kotlin-test",                     version.ref = "kotlin" }
junit4                = { module = "junit:junit",                                           version = "4.13.2" }
kct-core              = { module = "dev.zacsweers.kctfork:core",                           version.ref = "kct" }
coroutines-core       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",        version.ref = "coroutines" }
coroutines-android    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",     version.ref = "coroutines" }
coroutines-test       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",        version.ref = "coroutines" }
compose-bom           = { module = "androidx.compose:compose-bom",                         version.ref = "compose-bom" }
compose-ui            = { module = "androidx.compose.ui:ui" }
compose-foundation    = { module = "androidx.compose.foundation:foundation" }
compose-material3     = { module = "androidx.compose.material3:material3" }
compose-ui-tooling    = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-data = { module = "androidx.compose.ui:ui-tooling-data" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-junit   = { module = "androidx.test.ext:junit",                version = "1.2.1" }
androidx-test-runner  = { module = "androidx.test:runner",                   version = "1.6.2" }
espresso-core         = { module = "androidx.test.espresso:espresso-core",   version = "3.7.0" }
activity-compose      = { module = "androidx.activity:activity-compose",                    version = "1.9.3" }
lifecycle-process     = { module = "androidx.lifecycle:lifecycle-process",                  version.ref = "lifecycle" }
lifecycle-runtime     = { module = "androidx.lifecycle:lifecycle-runtime-ktx",             version.ref = "lifecycle" }
lifecycle-viewmodel   = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",            version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
savedstate            = { module = "androidx.savedstate:savedstate",                        version = "1.2.1" }

[plugins]
kotlin-jvm     = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version = "0.30.0" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish",      version = "1.3.1" }
kotlin-android = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-lib    = { id = "com.android.library",                 version.ref = "android-gradle-plugin" }
android-app    = { id = "com.android.application",             version.ref = "android-gradle-plugin" }
